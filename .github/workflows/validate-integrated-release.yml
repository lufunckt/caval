name: Validate SEO and Tutor release

on:
  push:
    branches: [release/seo-area-tutor, release/design-site-tutor]

permissions:
  contents: read

jobs:
  integrated-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:tutor
      - run: npm run test:seo
      - run: npm run build
      - run: npm run test:seo:http
      - name: Install browser QA tools on the runner
        run: |
          npm install --prefix "$RUNNER_TEMP/erico-browser-qa" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          ln -s "$RUNNER_TEMP/erico-browser-qa/node_modules/@playwright" node_modules/@playwright
      - run: google-chrome --version
      - run: '"$RUNNER_TEMP/erico-browser-qa/node_modules/.bin/playwright" test --config tests/public-browser.config.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-design-preview
          path: test-results/
          retention-days: 7
