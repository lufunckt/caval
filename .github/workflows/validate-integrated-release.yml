name: Validate SEO and Tutor release

on:
  push:
    branches: [release/seo-area-tutor, release/design-site-tutor]

permissions:
  contents: read

jobs:
  integrated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:tutor
      - run: npm run test:seo
      - run: npm run build
      - run: npm run test:seo:http
      - name: Install browser QA tools on the runner
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/public-browser.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-design-preview
          path: test-results/
          retention-days: 7
